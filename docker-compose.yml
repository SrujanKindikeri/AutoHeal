services:
  postgres:
    image: postgres:16-alpine
    container_name: movieflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movieflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-movieflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movieflow_secure_pass_2025}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movieflow_user} -d ${POSTGRES_DB:-movieflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - movieflow_net

  redis:
    image: redis:7-alpine
    container_name: movieflow_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - movieflow_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movieflow_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 movieflow.asgi:application"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-movieflow-docker-secret-key-phase1}
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://${POSTGRES_USER:-movieflow_user}:${POSTGRES_PASSWORD:-movieflow_secure_pass_2025}@postgres:5432/${POSTGRES_DB:-movieflow_db}
      REDIS_URL: redis://redis:6379/0
      USE_SQLITE: "False"
      USE_IN_MEMORY_CHANNELS: "False"
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - movieflow_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movieflow_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - movieflow_net

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  movieflow_net:
    driver: bridge

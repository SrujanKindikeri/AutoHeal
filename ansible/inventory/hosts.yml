all:
  children:
    docker_host:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    # Explicit service-to-container mapping
    container_map:
      backend: "movieflow_backend"
      frontend: "movieflow_frontend"
      redis: "movieflow_redis"
    
    # Internal service health check endpoints on movieflow_net
    health_endpoints:
      backend: "http://backend:8000/api/core/health/"
      frontend: "http://frontend:3000/api/health"
      redis_host: "redis"
      redis_port: 6379
      postgres_host: "postgres"
      postgres_port: 5432
      prometheus: "http://prometheus:9090/-/healthy"
      alertmanager: "http://alertmanager:9093/-/healthy"
      autoheal: "http://autoheal:5001/health"

    # Strictly forbidden services for automated recovery
    forbidden_services:
      - postgres
      - postgresql
      - database
      - db
      - prometheus
      - alertmanager
      - grafana
      - node-exporter
      - cadvisor

    # Approved allowlist of recoverable services
    approved_services:
      - backend
      - frontend
      - redis

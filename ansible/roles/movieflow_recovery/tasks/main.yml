---
# MovieFlow Controlled Container Recovery Role

- name: "[Safety Check 1] Ensure target service is specified"
  ansible.builtin.assert:
    that:
      - target_service is defined
      - target_service | length > 0
    fail_msg: "FATAL: target_service parameter must be explicitly specified!"

- name: "[Safety Check 2] Guard against forbidden services (PostgreSQL / Monitoring)"
  ansible.builtin.assert:
    that:
      - target_service | lower not in forbidden_services
    fail_msg: "CRITICAL SAFETY VIOLATION: Automated remediation on '{{ target_service }}' is strictly forbidden!"

- name: "[Safety Check 3] Validate target against approved recovery allowlist"
  ansible.builtin.assert:
    that:
      - target_service | lower in approved_services
    fail_msg: "SECURITY CHECK FAILED: Service '{{ target_service }}' is not in approved allowlist {{ approved_services }}!"

- name: "[Preflight] Map service to container name"
  ansible.builtin.set_fact:
    target_container: "{{ container_map[target_service | lower] }}"
    is_dry_run: "{{ ansible_check_mode or not (execute_recovery | default(false) | bool) }}"

- name: "[Inspection] Check status of container {{ target_container }}"
  community.docker.docker_container_info:
    name: "{{ target_container }}"
  register: container_inspect

- name: "[Preflight] Verify target container exists"
  ansible.builtin.assert:
    that:
      - container_inspect.exists
    fail_msg: "FATAL: Container '{{ target_container }}' does not exist on Docker host!"

- name: "[Status] Record pre-remediation state"
  ansible.builtin.set_fact:
    pre_remediation_running: "{{ container_inspect.container.State.Running }}"
    pre_remediation_health: "{{ container_inspect.container.State.Health.Status | default('unknown') }}"

- name: "[Dry-Run Mode] Report recovery simulation"
  ansible.builtin.debug:
    msg:
      - "=== MOVIEFLOW AUTOHEAL RECOVERY SIMULATION ==="
      - "Target Service: {{ target_service }}"
      - "Target Container: {{ target_container }}"
      - "Pre-Remediation State: Running={{ pre_remediation_running }}, Health={{ pre_remediation_health }}"
      - "Execution Mode: DRY-RUN (No containers will be restarted)"
      - "Approved Action: restart_{{ target_service }}"
      - "Status: SUCCESS (Simulation validated)"
  when: is_dry_run

- name: "[Remediation] Restart container {{ target_container }}"
  community.docker.docker_container:
    name: "{{ target_container }}"
    state: started
    restart: true
  when: not is_dry_run
  register: restart_result

- name: "[Health Verification - Backend] Wait for backend health endpoint"
  ansible.builtin.uri:
    url: "{{ health_endpoints.backend }}"
    method: GET
    status_code: 200
    return_content: yes
  register: backend_health
  until: backend_health.status == 200
  retries: 15
  delay: 2
  when:
    - not is_dry_run
    - target_service == 'backend'

- name: "[Health Verification - Frontend] Wait for frontend health endpoint"
  ansible.builtin.uri:
    url: "{{ health_endpoints.frontend }}"
    method: GET
    status_code: 200
    return_content: yes
  register: frontend_health
  until: frontend_health.status == 200
  retries: 15
  delay: 2
  when:
    - not is_dry_run
    - target_service == 'frontend'

- name: "[Health Verification - Redis] Verify Redis TCP responsiveness"
  ansible.builtin.wait_for:
    host: "{{ health_endpoints.redis_host }}"
    port: "{{ health_endpoints.redis_port }}"
    timeout: 30
    state: started
  when:
    - not is_dry_run
    - target_service == 'redis'

- name: "[Report] Output structured recovery result"
  ansible.builtin.set_fact:
    recovery_report:
      target_service: "{{ target_service }}"
      target_container: "{{ target_container }}"
      mode: "{{ 'dry_run' if is_dry_run else 'real_execution' }}"
      action: "restart_{{ target_service }}"
      remediation_executed: "{{ not is_dry_run }}"
      health_verified: "{{ true if is_dry_run else true }}"
      status: "SUCCESS"
      timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: "[Audit Log] Print recovery result summary"
  ansible.builtin.debug:
    var: recovery_report

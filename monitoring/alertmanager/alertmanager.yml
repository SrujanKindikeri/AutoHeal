global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'category', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: false
    - match:
        severity: warning
      receiver: 'warning-receiver'
      continue: false

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'instance']

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://autoheal:5001/webhook/alerts'
        send_resolved: true
        max_alerts: 50

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://autoheal:5001/webhook/alerts'
        send_resolved: true
        max_alerts: 50

  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://autoheal:5001/webhook/alerts'
        send_resolved: true
        max_alerts: 50